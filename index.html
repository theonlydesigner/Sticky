<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoloSticker 3D Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0e0f12;
    }
    .gemini-gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #c084fc 45%, #f472b6 75%, #fbbf24 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gemini-glow-bg {
      background: radial-gradient(circle at 50% -20%, rgba(168, 85, 247, 0.25), rgba(59, 130, 246, 0.15), rgba(14, 15, 18, 0));
    }
    .gemini-card {
      background: rgba(22, 24, 29, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gemini-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.8);
      cursor: pointer;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col gemini-glow-bg antialiased selection:bg-purple-500/30">

  <header class="w-full max-w-7xl mx-auto px-6 py-5 flex items-center justify-between border-b border-white/5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-500 via-purple-500 to-pink-500 p-[1.5px] flex items-center justify-center shadow-lg shadow-purple-500/20">
        <div class="w-full h-full bg-[#0e0f12] rounded-[14px] flex items-center justify-center">
          <i data-lucide="sparkles" class="w-4 h-4 text-purple-400"></i>
        </div>
      </div>
      <h1 class="text-xl font-bold tracking-tight">HoloSticker <span class="gemini-gradient-text">3D</span></h1>
    </div>
    <div class="flex items-center gap-3 text-xs font-medium text-slate-400">
      <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span> WebGL Shader Engine
      </span>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <div class="lg:col-span-4 space-y-5">
      <div class="gemini-card rounded-3xl p-6 space-y-6">
        <div>
          <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-1">Finish & Material</h2>
          <p class="text-xs text-slate-400">Select physical material sheen and surface texture.</p>
        </div>

        <div class="grid grid-cols-2 gap-2" id="finishGroup">
          <button data-finish="holo" class="finish-btn py-2.5 px-3 rounded-xl border border-purple-500/50 bg-purple-500/10 text-xs font-semibold text-purple-300 transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Holographic
          </button>
          <button data-finish="gloss" class="finish-btn py-2.5 px-3 rounded-xl border border-white/10 bg-white/5 text-xs font-medium text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="sun" class="w-3.5 h-3.5"></i> High Gloss
          </button>
          <button data-finish="matte" class="finish-btn py-2.5 px-3 rounded-xl border border-white/10 bg-white/5 text-xs font-medium text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i> Matte Finish
          </button>
          <button data-finish="glitter" class="finish-btn py-2.5 px-3 rounded-xl border border-white/10 bg-white/5 text-xs font-medium text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="stars" class="w-3.5 h-3.5"></i> Metallic Foil
          </button>
        </div>

        <div class="space-y-4 pt-2 border-t border-white/5">
          <div class="space-y-2">
            <div class="flex justify-between text-xs font-medium">
              <span class="text-slate-300">Iridescence Sheen</span>
              <span id="iriVal" class="text-purple-400 font-mono">1.0</span>
            </div>
            <input type="range" id="iriRange" min="0" max="1" step="0.05" value="1.0" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-purple-500">
          </div>

          <div class="space-y-2">
            <div class="flex justify-between text-xs font-medium">
              <span class="text-slate-300">Roughness</span>
              <span id="roughVal" class="text-purple-400 font-mono">0.15</span>
            </div>
            <input type="range" id="roughRange" min="0" max="1" step="0.05" value="0.15" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-purple-500">
          </div>
        </div>

        <div class="space-y-2 pt-2 border-t border-white/5">
          <span class="text-xs font-medium text-slate-300 block mb-2">Studio Environment</span>
          <div class="grid grid-cols-3 gap-2" id="bgGroup">
            <button data-bg="grid" class="bg-btn py-2 px-2 rounded-xl border border-purple-500/50 bg-purple-500/10 text-[11px] font-medium text-purple-300">Grid</button>
            <button data-bg="dark" class="bg-btn py-2 px-2 rounded-xl border border-white/10 bg-white/5 text-[11px] font-medium text-slate-400">Dark</button>
            <button data-bg="gradient" class="bg-btn py-2 px-2 rounded-xl border border-white/10 bg-white/5 text-[11px] font-medium text-slate-400">Glow</button>
          </div>
        </div>

        <button id="exportBtn" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 hover:opacity-95 font-medium text-sm text-white shadow-lg shadow-purple-500/25 transition-all flex items-center justify-center gap-2 disabled:opacity-40" disabled>
          <i data-lucide="camera" class="w-4 h-4"></i> Export Mockup Image
        </button>
      </div>
    </div>

    <div class="lg:col-span-8 flex flex-col">
      <div class="gemini-card rounded-3xl p-4 min-h-[520px] flex flex-col items-center justify-center relative overflow-hidden group">
        
        <div id="dropZone" class="w-full h-full min-h-[480px] rounded-2xl border-2 border-dashed border-white/10 hover:border-purple-500/50 transition-colors flex flex-col items-center justify-center p-8 text-center cursor-pointer bg-white/[0.01]">
          <input type="file" id="fileInput" accept="image/png, image/webp" class="hidden">
          <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-blue-500/10 via-purple-500/10 to-pink-500/10 border border-purple-500/20 flex items-center justify-center mb-4 text-purple-400 group-hover:scale-110 transition-transform">
            <i data-lucide="upload-cloud" class="w-8 h-8"></i>
          </div>
          <p class="text-sm font-semibold text-slate-200 mb-1">Drop transparent PNG sticker artwork here</p>
          <p class="text-xs text-slate-400 max-w-xs">Supports PNG or WEBP with alpha channel</p>
        </div>

        <div id="canvasWrapper" class="hidden relative w-full h-[480px] rounded-2xl overflow-hidden cursor-grab active:cursor-grabbing">
          <div id="threeContainer" class="w-full h-full"></div>
          <div class="absolute bottom-4 left-4 px-3 py-1.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10 text-[11px] text-slate-400 flex items-center gap-2 pointer-events-none">
            <i data-lucide="mouse-pointer-2" class="w-3 h-3 text-purple-400"></i> Hover & Drag to tilt sticker
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const threeContainer = document.getElementById('threeContainer');
    const exportBtn = document.getElementById('exportBtn');
    const iriRange = document.getElementById('iriRange');
    const roughRange = document.getElementById('roughRange');
    const iriVal = document.getElementById('iriVal');
    const roughVal = document.getElementById('roughVal');

    let scene, camera, renderer, stickerMesh, material, light, pointLight;
    let targetRotationX = 0, targetRotationY = 0;
    let currentTexture = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-purple-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-purple-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-purple-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      threeContainer.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      light = new THREE.DirectionalLight(0xffffff, 2.5);
      light.position.set(2, 3, 4);
      scene.add(light);

      pointLight = new THREE.PointLight(0xa855f7, 4, 10);
      pointLight.position.set(0, 0, 3);
      scene.add(pointLight);

      material = new THREE.MeshPhysicalMaterial({
        transparent: true,
        side: THREE.DoubleSide,
        roughness: 0.15,
        metalness: 0.8,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        iridescence: 1.0,
        iridescenceIOR: 1.3,
        iridescenceThicknessRange: [100, 400]
      });

      const geometry = new THREE.PlaneGeometry(3, 3);
      stickerMesh = new THREE.Mesh(geometry, material);
      scene.add(stickerMesh);

      animate();
    }

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const loader = new THREE.TextureLoader();
        loader.load(e.target.result, (texture) => {
          currentTexture = texture;
          material.map = texture;
          material.needsUpdate = true;

          const aspect = texture.image.width / texture.image.height;
          if (aspect > 1) {
            stickerMesh.scale.set(2.8, 2.8 / aspect, 1);
          } else {
            stickerMesh.scale.set(2.8 * aspect, 2.8, 1);
          }

          dropZone.classList.add('hidden');
          canvasWrapper.classList.remove('hidden');
          exportBtn.disabled = false;

          if (!renderer) initThree();
        });
      };
      reader.readAsDataURL(file);
    }

    const finishes = {
      holo: { iridescence: 1.0, iridescenceIOR: 1.3, roughness: 0.15, metalness: 0.8, clearcoat: 1.0 },
      gloss: { iridescence: 0.0, iridescenceIOR: 1.0, roughness: 0.05, metalness: 0.1, clearcoat: 1.0 },
      matte: { iridescence: 0.0, iridescenceIOR: 1.0, roughness: 0.85, metalness: 0.0, clearcoat: 0.0 },
      glitter: { iridescence: 0.6, iridescenceIOR: 1.6, roughness: 0.4, metalness: 0.9, clearcoat: 0.8 }
    };

    document.querySelectorAll('.finish-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.finish-btn').forEach(b => {
          b.className = "finish-btn py-2.5 px-3 rounded-xl border border-white/10 bg-white/5 text-xs font-medium text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1.5";
        });
        btn.className = "finish-btn py-2.5 px-3 rounded-xl border border-purple-500/50 bg-purple-500/10 text-xs font-semibold text-purple-300 transition-all flex items-center justify-center gap-1.5";

        const finishKey = btn.dataset.finish;
        const preset = finishes[finishKey];
        
        material.iridescence = preset.iridescence;
        material.iridescenceIOR = preset.iridescenceIOR;
        material.roughness = preset.roughness;
        material.metalness = preset.metalness;
        material.clearcoat = preset.clearcoat;
        material.needsUpdate = true;

        iriRange.value = preset.iridescence;
        roughRange.value = preset.roughness;
        iriVal.textContent = preset.iridescence.toFixed(2);
        roughVal.textContent = preset.roughness.toFixed(2);
      });
    });

    iriRange.addEventListener('input', () => {
      material.iridescence = parseFloat(iriRange.value);
      iriVal.textContent = parseFloat(iriRange.value).toFixed(2);
    });

    roughRange.addEventListener('input', () => {
      material.roughness = parseFloat(roughRange.value);
      roughVal.textContent = parseFloat(roughRange.value).toFixed(2);
    });

    document.querySelectorAll('.bg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bg-btn').forEach(b => {
          b.className = "bg-btn py-2 px-2 rounded-xl border border-white/10 bg-white/5 text-[11px] font-medium text-slate-400";
        });
        btn.className = "bg-btn py-2 px-2 rounded-xl border border-purple-500/50 bg-purple-500/10 text-[11px] font-medium text-purple-300";

        const bg = btn.dataset.bg;
        if (bg === 'grid') {
          threeContainer.className = "w-full h-full bg-[radial-gradient(#ffffff15_1px,transparent_1px)] [background-size:16px_16px]";
        } else if (bg === 'dark') {
          threeContainer.className = "w-full h-full bg-[#0e0f12]";
        } else {
          threeContainer.className = "w-full h-full bg-radial-gradient(circle, rgba(168,85,247,0.2) 0%, rgba(14,15,18,1) 80%)";
        }
      });
    });

    window.addEventListener('mousemove', (e) => {
      if (!canvasWrapper || canvasWrapper.classList.contains('hidden')) return;
      const rect = canvasWrapper.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      targetRotationY = x * 0.6;
      targetRotationX = -y * 0.6;

      if (pointLight) {
        pointLight.position.x = x * 3;
        pointLight.position.y = y * 3;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      if (stickerMesh) {
        stickerMesh.rotation.y += (targetRotationY - stickerMesh.rotation.y) * 0.1;
        stickerMesh.rotation.x += (targetRotationX - stickerMesh.rotation.x) * 0.1;
      }
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    exportBtn.addEventListener('click', () => {
      renderer.render(scene, camera);
      const dataURL = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = 'holosticker-3d-mockup.png';
      a.click();
    });

    window.addEventListener('resize', () => {
      if (!renderer || !camera) return;
      camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
    });
  </script>
</body>
</html>
