<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockYourSticker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col antialiased bg-black selection:bg-white/20">

  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    <div class="lg:col-span-4 space-y-6">
      <div class="glass-panel rounded-3xl p-6 space-y-8 fade-in-up">
        <div>
          <h2 class="text-sm font-medium text-white mb-1">Finish & Material</h2>
          <p class="text-xs text-slate-400">Select physical material sheen and surface texture.</p>
        </div>

        <div class="grid grid-cols-2 gap-3" id="finishGroup">
          <button data-finish="holo" class="finish-btn active-btn">Holographic</button>
          <button data-finish="gloss" class="finish-btn inactive-btn">High Gloss</button>
          <button data-finish="matte" class="finish-btn inactive-btn">Matte Finish</button>
          <button data-finish="glitter" class="finish-btn inactive-btn">Metallic Foil</button>
        </div>

        <div class="space-y-5 pt-4 border-t border-white/5">
          <div class="space-y-3">
            <div class="flex justify-between text-xs font-medium">
              <span class="text-slate-300">Rainbow Effect <span class="text-slate-500 font-normal">(Iridescence)</span></span>
              <span id="iriVal" class="text-white font-mono">1.0</span>
            </div>
            <input type="range" id="iriRange" min="0" max="1" step="0.05" value="1.0" class="custom-slider">
          </div>

          <div class="space-y-3">
            <div class="flex justify-between text-xs font-medium">
              <span class="text-slate-300">Surface Blur <span class="text-slate-500 font-normal">(Roughness)</span></span>
              <span id="roughVal" class="text-white font-mono">0.15</span>
            </div>
            <input type="range" id="roughRange" min="0" max="1" step="0.05" value="0.15" class="custom-slider">
          </div>
        </div>

        <div class="space-y-3 pt-4 border-t border-white/5">
          <span class="text-xs font-medium text-slate-300 block">Studio Background</span>
          <div class="grid grid-cols-2 gap-3" id="bgGroup">
            <button data-bg="grid" class="bg-btn active-btn">Grid</button>
            <button data-bg="dark" class="bg-btn inactive-btn">Pure Black</button>
          </div>
        </div>

        <button id="exportBtn" class="w-full py-3.5 px-4 rounded-2xl bg-white text-black hover:bg-slate-200 font-medium text-sm transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:hover:bg-white" disabled>
          <i data-lucide="download" class="w-4 h-4"></i> Export Mockup
        </button>
      </div>
    </div>

    <div class="lg:col-span-8 flex flex-col fade-in-up" style="animation-delay: 0.1s;">
      <div class="glass-panel rounded-3xl p-2 h-[600px] flex flex-col items-center justify-center relative overflow-hidden group">
        
        <div id="dropZone" class="w-full h-full rounded-2xl border border-dashed border-white/10 hover:border-white/30 transition-all duration-300 flex flex-col items-center justify-center p-8 text-center cursor-pointer bg-white/[0.02] hover:bg-white/[0.04]">
          <input type="file" id="fileInput" accept="image/png, image/webp, image/jpeg, image/svg+xml" class="hidden">
          <i data-lucide="plus" class="w-8 h-8 text-white/50 mb-4 group-hover:scale-110 transition-transform duration-500"></i>
          <p class="text-sm font-medium text-white mb-2">Upload Artwork</p>
          <p class="text-xs text-slate-400 max-w-xs">Supports PNG, JPG, SVG, WEBP</p>
        </div>

        <div id="canvasWrapper" class="hidden absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing">
          <div id="threeContainer" class="w-full h-full bg-grid-pattern rounded-2xl overflow-hidden"></div>
          
          <!-- Floating Reset View Button -->
          <button id="resetViewBtn" class="absolute top-5 right-5 px-3 py-2 rounded-xl glass-panel text-xs text-slate-300 hover:text-white hover:bg-white/10 transition-all flex items-center gap-2 z-10">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset View
          </button>

          <div class="absolute bottom-6 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-full glass-panel text-[11px] text-slate-300 flex items-center gap-3 pointer-events-none opacity-0 transition-opacity duration-500 whitespace-nowrap" id="hintBadge">
            <span class="flex items-center gap-1.5"><i data-lucide="rotate-3d" class="w-3.5 h-3.5 text-white"></i> Left-Click: Rotate</span>
            <span class="w-1 h-1 rounded-full bg-white/20"></span>
            <span class="flex items-center gap-1.5"><i data-lucide="move" class="w-3.5 h-3.5 text-white"></i> Right-Click: Pan</span>
            <span class="w-1 h-1 rounded-full bg-white/20"></span>
            <span class="flex items-center gap-1.5"><i data-lucide="zoom-in" class="w-3.5 h-3.5 text-white"></i> Scroll: Zoom</span>
          </div>
        </div>

      </div>
    </div>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
